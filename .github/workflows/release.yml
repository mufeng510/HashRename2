name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu --bundles appimage,deb
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis
          - os: macos-latest
            target: universal-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Tauri 系统依赖(Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev
      - name: 安装 Rust 目标(macOS Universal)
        if: matrix.target == 'universal-apple-darwin'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.target != 'universal-apple-darwin'
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 构建并上传到 Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "HashRename ${{ github.ref_name }}"
          releaseBody: |
            跨平台文件哈希去重与序号重命名工具。

            - Windows:HashRename_x64-setup.exe(NSIS 安装程序)
            - macOS:HashRename_universal.dmg(Apple Silicon + Intel)
            - Linux:HashRename.AppImage 与 .deb

            右键菜单安装:运行 `hashrename --install-context-menu`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
