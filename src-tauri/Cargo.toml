[package]
name = "hashrename"
version = "0.1.0"
description = "Hash dedupe & sequential rename tool for folders"
authors = ["HashRename"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "hashrename_lib"
crate-type = ["rlib"]

[[bin]]
name = "hashrename"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md-5 = "0.10"
sha2 = "0.10"
rayon = "1.10"
trash = "5"
thiserror = "2"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.55"

[profile.release]
strip = true
lto = true
codegen-units = 1
